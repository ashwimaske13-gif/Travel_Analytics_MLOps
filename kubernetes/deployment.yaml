apiVersion: apps/v1
kind: Deployment

metadata:
  name: travel-analytics

spec:
  replicas: 1

  selector:
    matchLabels:
      app: travel-analytics

  template:
    metadata:
      labels:
        app: travel-analytics

    spec:
      containers:
        - name: travel-analytics
          image: travel-analytics:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5