<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Travel Partner | Gender Classification</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white text-center">

            <h2>👤 Gender Classification</h2>

            <p class="mb-0">
                Predict gender using name, company and age
            </p>

        </div>

        <div class="card-body p-4">

            <form
                action="{{ url_for('gender') }}"
                method="POST">

                <!-- NAME -->

                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter full name"
                        required>

                </div>


                <!-- COMPANY -->

                <div class="mb-3">

                    <label class="form-label">
                        Company
                    </label>

                    <select
                        name="company"
                        class="form-select"
                        required>

                        <option value="">
                            Select Company
                        </option>

                        {% for company in companies %}

                        <option value="{{ company }}">
                            {{ company }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- AGE -->

                <div class="mb-3">

                    <label class="form-label">
                        Age
                    </label>

                    <input
                        type="number"
                        name="age"
                        class="form-control"
                        min="1"
                        max="100"
                        placeholder="Enter age"
                        required>

                </div>


                <div class="text-center">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg">

                        Predict Gender

                    </button>

                </div>

            </form>


            {% if prediction %}

            <div class="alert alert-success text-center mt-4">

                <h4>
                    Predicted Gender
                </h4>

                <h2>
                    {{ prediction }}
                </h2>

            </div>

            {% endif %}

        </div>

    </div>

</div>

</body>

</html>
