<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Partner | Flight Price Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<div class="container py-5">

<div class="card shadow-lg border-0">

<div class="card-header bg-primary text-white text-center p-4">

<h2>✈ Travel Partner</h2>

<p class="mb-0">
AI Powered Flight Price Prediction
</p>

</div>


<div class="card-body">

<form action="{{ url_for('predict') }}" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Travel Code
</label>

<input
type="number"
class="form-control"
name="travelCode"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
User Code
</label>

<input
type="number"
class="form-control"
name="userCode"
required>

</div>

</div>



<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
From
</label>

<select
id="from"
name="from"
class="form-select">

{% for city in from_cities %}

<option value="{{ city }}">
{{ city }}
</option>

{% endfor %}

</select>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
To
</label>

<select
id="to"
name="to"
class="form-select">

{% for city in to_cities %}

<option value="{{ city }}">
{{ city }}
</option>

{% endfor %}

</select>

</div>

</div>



<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Flight Type
</label>

<select
name="flightType"
class="form-select">

{% for item in flight_types %}

<option value="{{ item }}">
{{ item }}
</option>

{% endfor %}

</select>

</div>



<div class="col-md-6 mb-3">

<label class="form-label">
Airline
</label>

<select
id="agency"
name="agency"
class="form-select"
required>

{% for item in airlines %}

<option value="{{ item }}">
{{ item }}
</option>

{% endfor %}

</select>

</div>

</div>



<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Departure Date
</label>

<input
type="date"
id="departureDate"
name="departure_date"
class="form-control"
required>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Flight Time (Hours)
</label>

<input
type="number"
step="0.01"
id="time"
name="time"
class="form-control"
readonly>

</div>

</div>



<div class="row">

<div class="col-md-6 mb-4">

<label class="form-label">
Distance (KM)
</label>

<input
type="number"
step="0.01"
id="distance"
name="distance"
class="form-control"
readonly>

</div>

</div>



<input type="hidden" id="year" name="year">
<input type="hidden" id="month" name="month">
<input type="hidden" id="day" name="day">
<input type="hidden" id="day_of_week" name="day_of_week">
<input type="hidden" id="week_of_year" name="week_of_year">



<div class="text-center">

<button
type="submit"
class="btn btn-primary btn-lg px-5">

Predict Flight Price

</button>

</div>

</form>

</div>

</div>


{% if prediction %}

<div class="card mt-4 shadow">

<div class="card-body text-center">

<h3 class="text-success">

Estimated Flight Price

</h3>

<h1>

₹ {{ prediction }}

</h1>

<hr>

<h5>

🎉 Flight Available

</h5>

<p>

Thank you for choosing
<strong>Travel Partner</strong>

</p>

</div>

</div>

{% endif %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="{{ url_for('static', filename='js/flight.js') }}"></script>

</body>

</html>
